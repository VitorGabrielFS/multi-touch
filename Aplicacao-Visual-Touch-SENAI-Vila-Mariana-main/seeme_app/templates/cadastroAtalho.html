{% block title %}Ajustes - SeeMe{% endblock %}
{% extends 'base.html' %}

{% block content %}

<div class="accordion" id="accordionExample">
    <div class="accordion-item">
        <h2 class="accordion-header">
            <button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#collapseOne" aria-expanded="true" aria-controls="collapseOne">
                Cadastrar atalho para site
            </button>
        </h2>

        <div id="collapseOne" class="accordion-collapse collapse show" data-bs-parent="#accordionExample">
            <div class="accordion-body">
                <div>
                    <div class="card card-body">
                        <form method="POST" action="{{ url_for('main.cadastro_atalho') }}" enctype="multipart/form-data">
                            <div class="mb-3">
                                <label for="siteNameInput" class="form-label">Nome do site</label>
                                <input type="text" class="form-control" id="nomeSite" aria-describedby="nameHelp" name="nomeSite" placeholder="Exemplo">

                                <br>

                                <label for="siteUrlInput" class="form-label">URL do site</label>
                                <input type="url" class="form-control" id="entradaUrl" aria-describedby="urlHelp" name="entradaUrl" placeholder="https://www.exemplo.com">
                                <div id="urlHelp" class="form-text">Insira a URL completa do site que você deseja cadastrar.</div>

                                <br>

                                <div class="mb-3">
                                    <label for="formFile" class="form-label">Escolha um icone</label>
                                    <input class="form-control" type="file" id="entradaImagem" name="entradaImagem" accept="image/*">
                                </div>

                                <div class="input-group mb-3">
                                    <span class="input-group-text" id="basic-addon1">Gesto/Número</span>
                                    <input type="text" class="form-control" placeholder="Exemplo 'A' ou '1'" 
                                        aria-label="" aria-describedby="basic-addon1" maxlength="1" pattern="[a-zA-Z0-9]"
                                        name="letraNumero" id="letraNumero" style="width: 75px;" required>
                                </div>
                            </div>

                            <!--Poderia ser feito com action também-->
                            <button type="submit" name="form_type" value="cadastrar_site" class="btn btn-primary">Cadastrar</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="accordion-item">
        <h2 class="accordion-header">
            <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseTwo" aria-expanded="false" aria-controls="collapseTwo">
                Ações rápidas
            </button>
        </h2>

        <div id="collapseTwo" class="accordion-collapse collapse" data-bs-parent="#accordionExample">
            <div class="accordion-body">
                <div>
                    <div class="card card-body">
                        <form>
                            <div class="mb-3">
                                <label for="siteNameInput" class="form-label">Nome</label>
                                <input type="text" class="form-control" id="nomeAtalho" name="atalho" aria-describedby="nameHelp" placeholder="Exemplo">

                                <br>

                                <select class="form-select" id="tipoAcao" name="tipoAcao" aria-label="Default select example">
                                    <option selected>Selecione a ação</option>
                                    <option value="1">Tirar print</option>
                                    <option value="2">Encerrar captura de aúdio</option>
                                    <option value="3">Fechar Câmera</option>
                                </select>
                            </div>

                            <button type="submit" class="btn btn-primary" value="cadastrar_acao">Cadastrar</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <div class="accordion-item">
            <h2 class="accordion-header">
                <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseThree" aria-expanded="false" aria-controls="collapseThree">
                    Abrir programas    
                </button>
            </h2>
            <div id="collapseThree" class="accordion-collapse collapse" data-bs-parent="#accordionExample">
                <div class="accordion-body">
                    <div>
                        <div class="card card-body">
                            <form>
                                <div class="mb-3">
                                    <label for="siteNameInput" class="form-label">Nome</label>
                                    <input type="text" class="form-control" id="nomePrograma" name="nomePrograma" aria-describedby="nameHelp" placeholder="Exemplo">

                                    <br>

                                    <select class="form-select" name="selecaoPrograma" aria-label="Default select example">
                                        <option selected>Selecione o programa</option>
                                        <option value="1">Calculadora</option>
                                        <option value="2">Bloco de notas</option>
                                        <option value="3">Explorador de Arquivos</option>
                                    </select>
                                </div>

                                <button type="submit" class="btn btn-primary" value="cadastrar_programa">Cadastrar</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

{% endblock %}
